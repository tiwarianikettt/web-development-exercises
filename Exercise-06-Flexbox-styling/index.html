<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise- 6</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="<link rel=" preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!--
Exercise 6

Topic:
CSS Flexbox

Objective:
Given below is a link of a website named- Ultraedit.
You have to make the nav bar of the website as it is using flexbox tool.

Link: https://www.ultraedit.com/
-->
    <header>

        <div class="offer">

            <div class="text">
                <p>UE Core & Enterprise Subscriptions: Get <b>10% Off</b> on your second year</p>
            </div>

            <div class="icon">
                <i class="fa-solid fa-info-circle"></i>
            </div>

            <div class="offer-btn">
                <button>Buy Now <i class="fa-solid fa-arrow-right"></i></button>
            </div>

        </div>

        <nav>

            <div class="logo">
                <img src="../Exercise-06-Flexbox-styling/images/UE-logo.svg" alt="UE_Logo">
            </div>

            <div class="services">
                <ul>
                    <li><a href="#">Products <i class="fa-solid fa-angle-down"></i></a></li>
                    <li><a href="#">Buy</a></li>
                    <li><a href="#">Renew</a></li>
                    <li><a href="#">Support <i class="fa-solid fa-angle-down"></i></a></li>
                    <li><a href="#">Learn <i class="fa-solid fa-angle-down"></i></a></li>
                    <li><a href="#">Company <i class="fa-solid fa-angle-down"></i></a></li>
                </ul>
            </div>

            <div class="btn">
                <div class="download-btn">
                    <button>Download</button>
                </div>

                <div class="lang" lang="en">
                    English
                </div>

                <div class="search">
                    <i class="fa-solid fa-search"></i>
                </div>
            </div>

        </nav>
    </header>
</body>

</html>
