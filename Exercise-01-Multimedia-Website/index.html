<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise- 1</title>
</head>

<body>
    <!--
Exercise 1
Topic: HTML Audio & Video
Objective:
Create a webpage containing five audio files and five video files using only HTML.
-->

    <h3>Audios</h3>

    <div class="audios">

        <audio controls loop>
            <source src="audios/1.mp3.mp3">
        </audio>

        <audio controls loop>
            <source src="audios/2.mp3.mp3">
        </audio>

        <audio controls loop>
            <source src="audios/3.mp3.mp3">
        </audio>

        <audio controls loop>
            <source src="audios/4.mp3.mp3">
        </audio>

        <audio controls loop>
            <source src="audios/5.mp3.mp3">
        </audio>

    </div>

    <h3>Videos</h3>

    <div class="videos">

        <video controls muted loop width="200px">
            <source src="videos/1.mp4.mp4">
        </video>

        <video controls muted loop width="200px">
            <source src="videos/2.mp4.mp4">
        </video>


        <video controls muted loop width="200px">
            <source src="videos/3.mp4.mp4">
        </video>


        <video controls muted loop width="200px">
            <source src="videos/4.mp4.mp4">
        </video>


        <video controls muted loop width="200px">
            <source src="videos/5.mp4.mp4">
        </video>

    </div>
</body>

</html>
